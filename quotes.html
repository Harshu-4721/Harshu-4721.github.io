<!DOCTYPE html>
<html>
<head>
    <title>Brother's Quotes</title>
    <style>
        body {
  font-family: 'Segoe UI', sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #f0f8ff, #e6f7ff);
  padding: 50px;
}
#quote {
  font-size: 26px;
  margin: 20px;
  color: #222;
  transition: opacity 0.5s ease-in-out;
}
button {
  background: #4CAF50;
  color: white;
  padding: 12px 28px;
  font-size: 16px;
  border: none;
  border-radius: 6px;
  cursor: pointer;
}
button:hover {
  background: #45a049;
}    </style>
</head>
<body>
    <h1>Thanks for 4 Years, Mentor Bro! 💻</h1>
    <div id="quote">"Click for a new quote!"</div>
    <button onclick="newQuote()">New Quote</button>

    <script>
        const quotes = [
            "Great teachers like you push us beyond limits! - Your Sister",
            "Strict brother, best mentor, forever strong! 🎉",
            "Thanks for guiding me in the coding world! 🚀",
            "Study hard, Always stay Independent, and learn many more lessons with your help! 📚",
            "Brother-sister team unbeatable! ❤️"
        ];
        function newQuote() {
            const random = Math.floor(Math.random() * quotes.length);
            document.getElementById('quote').innerHTML = quotes[random];
        }
    </script>
</body>
</html>
